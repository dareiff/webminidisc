server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The app ships ~20 MB of wasm/worker assets; keep transfers small.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm application/manifest+json;

    # Trust the reverse proxy in front of this container for real client IPs.
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # NOTE: deliberately no Cross-Origin-Embedder/Opener-Policy. The app only
    # feature-detects SharedArrayBuffer (never constructs one), so it does not
    # need cross-origin isolation -- and enabling COEP would break the
    # cross-origin calls the song-recognition and remote-library features make.

    # The service worker must never be cached, or clients pin an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed filenames here, so these are safe to pin.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Large, stable binaries loaded by the encoders/emulator.
    location ~* \.(wasm|bin|cmi)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
